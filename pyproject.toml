[project]
name = "gospel-search"
version = "0.1.0"
description = "Semantic search over General Conference talks and the standard works"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "anthropic",
    "beautifulsoup4",
    "lxml",
    "numpy",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.scripts]
gospel = "gospel_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
